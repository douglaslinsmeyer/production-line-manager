# =============================================================================
# RabbitMQ MQTT Configuration - DEVELOPMENT ENVIRONMENT
# =============================================================================
# MQTT Protocol Support: 3.1, 3.1.1, and 5.0 (RabbitMQ 3.13+)
#
# Current Client Versions:
# - ESP32-S3 Firmware: MQTT 3.1.1 (PubSubClient library)
# - Go API: MQTT (version negotiated)
# - Web UI: Not connected (HTTP REST only)
#
# MQTT 5.0 Limitations in RabbitMQ:
# - QoS 2 (exactly-once) is NOT supported - clients will be disconnected
# - Shared subscriptions are NOT supported
# - AUTH packet (re-authentication) is NOT supported
#
# ⚠️  NON-STANDARD CONFIGURATION:
# - Web MQTT port: 9001 (RabbitMQ default: 15675)
# - Web MQTT path: / (RabbitMQ default: /ws)
# - Connection string: ws://host:9001/ instead of ws://host:15675/ws
#
# ⚠️  DEVELOPMENT ONLY - DO NOT USE IN PRODUCTION
# - Anonymous access enabled (mqtt.allow_anonymous = true)
# - Default guest/guest credentials
# - No TLS/SSL encryption
# - All ports exposed to localhost
# =============================================================================

# Core RabbitMQ Settings
listeners.tcp.default = 5672
management.tcp.port = 15672

# MQTT Plugin Configuration
mqtt.listeners.tcp.default = 1883
mqtt.allow_anonymous = true  # DEV ONLY
mqtt.default_user = guest    # DEV ONLY
mqtt.default_pass = guest    # DEV ONLY
mqtt.vhost = /
mqtt.exchange = amq.topic
mqtt.max_session_expiry_interval_seconds = 86400
mqtt.prefetch = 10

# WebSocket Support (Web MQTT Plugin)
# NON-STANDARD: Using port 9001 instead of 15675, path / instead of /ws
web_mqtt.tcp.port = 9001
web_mqtt.ws_path = /
web_mqtt.ws_opts.compress = true           # Enable compression
web_mqtt.ws_opts.max_frame_size = 50000    # Max WebSocket frame size
web_mqtt.ws_opts.idle_timeout = 60000      # 60 second idle timeout

# Logging
log.console = true
log.console.level = info
log.file = false  # Dev only

# Persistence & Memory
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# Connection Settings
mqtt.tcp_listen_options.backlog = 4096
mqtt.tcp_listen_options.nodelay = true
